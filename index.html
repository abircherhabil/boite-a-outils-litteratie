<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boîte à outils littératie M-6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : barre latérale fixe (menu + filtres) à gauche, contenu en fiches à droite; empilé sur téléphone. Look unique : vert sapin + menthe. */
:root{
  --bg:#1F3832; --panel:#24413A; --card:#2F5149; --card-2:#36594F; --line:#45685E; --line2:#5B7D73; --line3:#3D5F55;
  --fg:#F1F7F4; --fg2:#D2E2DB; --muted:#BFD4CC; --dim:#A3BDB3; --heading:#FFFFFF;
  --accent:#A6E3C8; --accent-hover:#C2EEDB; --accent-ink:#0B201A; --accent-text:#A6EBD3; --accent-soft:rgba(166,227,200,.12); --accent-line:rgba(166,227,200,.38);
  --hero-a:#345650; --hero-b:#23403A; --glow:#36594F; --input:#1A322C; --tag:#3F6158; --tag-fg:#F1F7F4; --glass:rgba(255,255,255,.04);
  --head-bg:rgba(31,56,50,.82); --shadow:rgba(0,0,0,.4); --backdrop:rgba(5,10,8,.7);
  --silver:radial-gradient(circle at 30% 25%,#F3FCF8 0%,#A8D9C8 45%,#2F5E50 100%);
  --f-display:"Lexend",system-ui,sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#E4ECE8; --panel:#EEF3F1; --card:#F5F8F6; --card-2:#FBFCFB; --line:#C3D4CC; --line2:#9FB6AB; --line3:#D2DFD9;
  --fg:#17221F; --fg2:#2B3B36; --muted:#42554E; --dim:#5A6E67; --heading:#10201B;
  --accent:#1F6B52; --accent-hover:#185842; --accent-ink:#FFFFFF; --accent-text:#1F6B52; --accent-soft:rgba(31,107,82,.08); --accent-line:rgba(31,107,82,.32);
  --hero-a:#F4F8F6; --hero-b:#D9E6E0; --glow:#CFE3DA; --input:#F5F8F6; --tag:#D6E5DE; --tag-fg:#17221F; --glass:rgba(255,255,255,.55);
  --head-bg:rgba(238,243,241,.85); --shadow:rgba(23,34,31,.12); --backdrop:rgba(20,30,27,.45);
  --silver:radial-gradient(circle at 30% 25%,#FFFFFF 0%,#BFE3D4 45%,#3E7D69 100%);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
a{color:var(--accent)} a:hover{color:var(--accent-hover)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;color:var(--heading)}
button{font:inherit;color:inherit}
.app{min-height:100vh;background:radial-gradient(900px 500px at 85% -5%,var(--glow) 0%,var(--bg) 60%)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--heading);padding:0 6px}
.orb{flex:none;border-radius:50%;background:var(--silver);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(166,227,200,.25)}
.orb svg{stroke:#10261F}
.brand b{font-family:var(--f-display);font-size:17px;display:block;line-height:1.2}
.brand small{color:var(--dim);font-size:13px}
.search{position:relative}
.search input{width:100%;height:46px;padding:0 16px 0 44px;border:1px solid var(--line);border-radius:999px;background:var(--input);color:var(--fg);font:inherit}
.search svg{position:absolute;left:16px;top:14px;stroke:var(--dim)}
.lbl{padding:0 10px 6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:999px;border:1px solid transparent;color:var(--fg2);text-decoration:none;font-weight:500}
.nav a .orb{width:34px;height:34px;box-shadow:none}
.nav a[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--heading);font-weight:600}
.nav a:hover{background:var(--accent-soft)}
.nav.small a{padding:9px 12px}
.cycles{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg2);font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"],.chip[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
a.chip{display:inline-flex;align-items:center;text-decoration:none}
.cycles.stack{flex-direction:column}
.cycles.stack .chip{justify-content:flex-start;padding:0 16px;min-height:42px}
.mini{display:flex;flex-direction:column;gap:2px}
.mini a,.mini button{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 4px;border:0;border-bottom:1px solid var(--line3);background:none;text-align:left;text-decoration:none;color:var(--fg);cursor:pointer;width:100%}
.mini a span:last-child,.mini button span:last-child{color:var(--accent);font-size:13px;font-weight:700;white-space:nowrap}
.split{display:flex;flex-direction:column;gap:10px}
.split h3{font-size:16px;color:var(--accent-text)}
/* contenu */
main{min-width:0;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.crumb{font-size:14px;color:var(--dim)}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:clamp(24px,4vw,44px);background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 60%);border:1px solid var(--line);box-shadow:0 24px 60px var(--shadow);display:flex;flex-wrap:wrap;align-items:center;gap:28px}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(166,227,200,.22),rgba(166,227,200,0) 70%);pointer-events:none}
.hero > *{position:relative}
.hero .txt{flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}
.hero h1{font-weight:800;font-size:clamp(30px,4vw,50px);line-height:1.08;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;color:var(--fg2);font-size:17px;max-width:60ch}
.stats{flex:1 1 240px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{padding:16px;border-radius:20px;background:var(--glass);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--f-display);font-size:30px;color:var(--heading);font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--accent-hover);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--heading)}
.btn.ghost:hover{background:var(--accent-soft);color:var(--heading)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:24px}
.sec-head span{font-size:14px;color:var(--dim)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.tile{padding:12px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--fg)}
.tile:hover{border-color:var(--accent-line);color:var(--fg)}
.art{border-radius:14px;overflow:hidden;height:92px;border:1px solid var(--line)}
.art svg{display:block;width:100%;height:100%}
.tile .tt{display:flex;align-items:center;gap:10px;padding:0 4px}
.tile .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 14px/30px var(--f-display);text-align:center}
.tile h3{font-size:16px;line-height:1.25}
.tile .go{padding:0 4px 2px;font-weight:600;font-size:13px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:18px}
.card{padding:20px;border-radius:22px;background:linear-gradient(160deg,var(--card-2),var(--card) 70%);border:1px solid var(--line);display:flex;flex-direction:column;gap:11px;min-width:0}
.card h3{font-size:17px;line-height:1.3}
.card p{margin:0}
.card .d{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:3px 11px;border-radius:999px;background:var(--tag);color:var(--tag-fg);font-size:12.5px;font-weight:600}
.tag.hi{background:var(--accent);color:var(--accent-ink)}
.tag.line{background:transparent;border:1px solid var(--accent-line);color:var(--accent-text)}
.use{padding:11px 13px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:14px}
.use strong{color:var(--accent-text)}
.flag{font-size:13.5px;color:var(--fg2);padding-left:12px;border-left:2px solid var(--line2)}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px}
.src{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.subnav{display:flex;flex-wrap:wrap;gap:8px}
.subnav button{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--fg);font-weight:600;cursor:pointer}
.subnav button:hover{background:var(--accent-line)}
.note{display:flex;gap:14px;align-items:flex-start;padding:16px 20px;border-radius:20px;background:var(--accent-soft);border:1px solid var(--accent-line)}
.note p{margin:0;color:var(--fg)}
.panel{padding:24px;border-radius:24px;background:linear-gradient(160deg,var(--card-2),var(--card));border:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-top:14px}
.step{padding:14px;border-radius:18px;background:var(--glass);display:flex;flex-direction:column;gap:8px;color:var(--fg2);font-size:14px}
.num{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;display:flex;align-items:center;justify-content:center}
.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:22px}
.az{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:4px 24px}
.az h3{grid-column:1/-1;font-size:22px;color:var(--accent);margin-top:14px}
.az a{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line3);text-decoration:none;color:var(--fg)}
.az a span:last-child{color:var(--dim);font-size:13px;white-space:nowrap}
.refs{display:flex;flex-direction:column;gap:14px;max-width:80ch}
.refs p{margin:0;padding-left:2em;text-indent:-2em;color:var(--fg2);overflow-wrap:anywhere}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-top:20px;border-top:1px solid var(--line);font-size:14px;color:var(--dim)}
/* fiche */
dialog{width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 48px);padding:0;border-radius:26px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
dialog::backdrop{background:var(--backdrop)}
.fi{padding:28px;display:flex;flex-direction:column;gap:16px}
.fi h2{font-size:26px}
.fi h4{margin:6px 0 0;font-family:var(--f-display);font-size:15px;color:var(--accent-text);text-transform:uppercase;letter-spacing:.05em}
.fi ul,.fi ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.fi .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card-2);color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center}
@media (max-width:900px){
  .app{flex-direction:column}
  .side{flex:none;border-right:0;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav a .orb{width:28px;height:28px}
  }
@media (prefers-reduced-motion:no-preference){.card,.tile{transition:border-color .2s,transform .2s}.tile:hover{transform:translateY(-2px)}}

/* en-tête fixe en haut (inspiré d'un portfolio) */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--head-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.top.scrolled{border-bottom-color:var(--line);box-shadow:0 8px 24px var(--shadow)}
.top .brand{margin-right:auto}
.top .brand small{display:block}
.tnav{display:flex;align-items:center;gap:2px}
.tnav a{padding:8px 12px;border-radius:999px;color:var(--fg2);text-decoration:none;font-weight:600;font-size:14.5px;white-space:nowrap;position:relative}
.tnav a:hover{color:var(--heading);background:var(--accent-soft)}
.tnav a[aria-current="page"]{color:var(--heading)}
.tnav a[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:2px;border-radius:2px;background:var(--accent)}
.theme{display:flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--glass);flex:none}
.theme button{min-height:34px;padding:0 13px;border:0;border-radius:999px;background:transparent;color:var(--fg2);font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px}
.theme button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.burger{display:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);cursor:pointer;align-items:center;justify-content:center;flex:none}
.burger svg{stroke:var(--fg)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.toolbar .search{flex:1 1 280px;max-width:460px}
.toolbar .cyc{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar .lbl{padding:0}
.totop{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 26px var(--shadow);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .25s,transform .25s;z-index:15}
.totop.on{opacity:1;pointer-events:auto;transform:none}
.totop svg{stroke:currentColor}
.sec-head h2{font-size:26px;position:relative;padding-bottom:8px}
.sec-head h2::after{content:"";position:absolute;left:0;bottom:0;width:44px;height:3px;border-radius:3px;background:var(--accent)}
@media (max-width:1000px){
  .tnav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;padding:10px 16px 16px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 16px 30px var(--shadow)}
  .tnav.open{display:flex}
  .tnav a{padding:12px 14px}
  .tnav a[aria-current="page"]{background:var(--accent-soft)}
  .tnav a[aria-current="page"]::after{display:none}
  .burger{display:flex}
}
@media (max-width:560px){.top .brand small{display:none}.theme button span{display:none}.theme button{padding:0 10px}}
@media (prefers-reduced-motion:no-preference){
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
  .reveal.in{opacity:1;transform:none}
}

/* menu sur une deuxième rangée pour afficher les titres complets */
@media (min-width:1001px){
  .top{flex-wrap:wrap;row-gap:4px;padding-bottom:6px}
  .tnav{order:3;flex:1 0 100%;justify-content:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:6px}
}
</style>
</head>
<body>


<div class="app">
  <header class="top" id="top">
    <a class="brand" href="#accueil">
      <span class="orb" style="width:42px;height:42px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M3 13h18"></path></svg></span>
      <span><b>Boîte à outils</b><small>Littératie · maternelle à 6e année</small></span>
    </a>
    <nav class="tnav" id="tnav" aria-label="Menu du site"><span id="nav" style="display:contents"></span><span id="nav2" style="display:contents"></span></nav>
    <div class="theme" role="group" aria-label="Thème d’affichage">
      <button type="button" data-theme-set="dark" aria-pressed="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span>Sombre</span></button>
      <button type="button" data-theme-set="light" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Clair</span></button>
    </div>
    <button class="burger" type="button" id="burger" aria-expanded="false" aria-controls="tnav" aria-label="Ouvrir le menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </header>
  <main><div class="wrap">
    <div class="toolbar">
      <form class="search" role="search" id="searchForm">
        <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Rechercher une ressource</label>
        <input id="q" type="search" placeholder="Rechercher une ressource…" autocomplete="off">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      </form>
      <div class="cyc"><span class="lbl" id="cycLbl">Filtrer par cycle</span><div class="cycles" role="group" aria-labelledby="cycLbl" id="cycles"></div></div>
    </div>
    <div id="view" style="display:flex;flex-direction:column;gap:28px"></div>
  </div></main>
  <button class="totop" type="button" id="totop" aria-label="Retour en haut"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
</div>

<dialog id="fiche" aria-labelledby="ficheTitle"><div class="fi" id="ficheBody"></div></dialog>

<script>
// ---------- Illustrations ----------
function art(i){

 {id:"mini1re",sec:["urgence"],sub:"1. Activités prêtes à utiliser",grp:"Mini-leçons de littératie, de la 1re à la 6e année",t:"1re année : jouer avec les syllabes",st:"2 activités · 15 min",cyc:["p"],d:"Deux activités orales avec des cartes-images. Dans la première, les élèves repèrent le mot qui commence par une syllabe donnée. Dans la seconde, ils tapent dans leurs mains pour découper un mot en syllabes et les compter.",u:"Parfait pour un retour de récréation : ça se fait au tapis, en grand groupe, sans crayon.",pdf:[["Activité 1 : Trouver la syllabe","pdf/activites/1re-Activite-1-Trouver-la-syllabe.pdf"],["Activité 2 : Compter les syllabes","pdf/activites/1re-Activite-2-Compter-les-syllabes.pdf"]]},
 {id:"mini2e",sec:["urgence"],sub:"1. Activités prêtes à utiliser",grp:"Mini-leçons de littératie, de la 1re à la 6e année",t:"2e année : à la chasse aux sons",st:"2 activités · 15 à 20 min",cyc:["p"],d:"Les élèves restent debout s’ils entendent le son /m/ au début d’un mot, sinon ils se cachent derrière leur chaise. Ensuite, chacun cherche dans la classe un objet qui commence (ou finit) par le même son qu’un autre mot.",u:"Les élèves bougent tout en travaillant la conscience phonologique : idéal quand le groupe a besoin de se dégourdir.",pdf:[["Activité 1 : Le son /m/","pdf/activites/2e-Activite-1-Le-son-m.pdf"],["Activité 2 : Chasse aux objets","pdf/activites/2e-Activite-2-Chasse-aux-objets.pdf"]]},
 {id:"mini3e",sec:["urgence"],sub:"1. Activités prêtes à utiliser",grp:"Mini-leçons de littératie, de la 1re à la 6e année",t:"3e année : deviner le sens d’un mot inconnu",st:"2 activités · 20 à 25 min",cyc:["p"],d:"Les élèves deviennent des détectives : ils cherchent des indices dans la phrase pour comprendre un mot nouveau. La deuxième activité ajoute une autre piste, le mot de base caché dans le mot. Chaque activité a sa fiche-élève.",u:"Une stratégie que les élèves pourront réutiliser dans toutes leurs lectures, même après notre passage.",pdf:[["Activité 1 : Observer le contexte","pdf/activites/3e-Activite-1-Observer-le-contexte.pdf"],["Activité 2 : Stratégies lexicales","pdf/activites/3e-Activite-2-Strategies-lexicales.pdf"]]},
 {id:"mini4e",sec:["urgence"],sub:"1. Activités prêtes à utiliser",grp:"Mini-leçons de littératie, de la 1re à la 6e année",t:"4e année : les familles de mots",st:"2 activités · 20 à 30 min",cyc:["m"],d:"On part des ressemblances dans une famille pour découvrir les mots de même famille. Puis, en équipes, les élèves ont deux minutes pour écrire le plus de mots de la même famille qu’un mot dicté, et s’en servent pour trouver sa consonne muette finale (le « t » de « petit », grâce à « petite »).",u:"Le défi en équipes motive les élèves, et l’astuce leur sert ensuite en dictée.",pdf:[["Activité 1 : Familles de mots","pdf/activites/4e-Activite-1-Familles-de-mots.pdf"],["Activité 2 : Consonnes muettes","pdf/activites/4e-Activite-2-Consonnes-muettes.pdf"]]},
 {id:"mini5e",sec:["urgence"],sub:"1. Activités prêtes à utiliser",grp:"Mini-leçons de littératie, de la 1re à la 6e année",t:"5e année : orthographe et phrase interrogative",st:"2 activités · 20 à 30 min",cyc:["m"],d:"En stations, les équipes corrigent des phrases sur des cartes orthographiques : accords, homophones, majuscules et accents. La deuxième activité leur fait construire des phrases interrogatives avec des cartes-mots à découper.",u:"Le matériel est prêt à imprimer et à découper, et les deux activités tiennent dans une même période.",pdf:[["Activité 1 : Cartes orthographiques","pdf/activites/5e-Activite-1-Cartes-orthographiques.pdf"],["Activité 2 : Phrase interrogative","pdf/activites/5e-Activite-2-Phrase-interrogative.pdf"]]},
 {id:"mini6e",sec:["urgence"],sub:"1. Activités prêtes à utiliser",grp:"Mini-leçons de littératie, de la 1re à la 6e année",t:"6e année : la chasse aux majuscules",st:"1 activité · 20 à 25 min",cyc:["m"],d:"Après un rappel des règles en grand groupe, les élèves repèrent les majuscules oubliées en début de phrase, dans les noms propres et dans les titres, puis les corrigent sur leur fiche.",u:"Une révision rapide qui se corrige en classe avant la fin de la période.",pdf:[["Activité 1 : Chasse aux majuscules","pdf/activites/6e-Activite-1-Chasse-aux-majuscules.pdf"]]},

  let L="";
  for(const r of list){const l=r.t.normalize("NFD")[0].toUpperCase();if(l!==L){L=l;html+=`<h3>${L}</h3>`}
    html+=`<a href="#${r.sec[0]}" data-open="${r.id}"><span>${esc(r.t)}</span><span>${SECTIONS[r.sec[0]].label}</span></a>`}
  return html+`</div>`+footer();
}
function renderRefs(){
  const list=R.filter(r=>r.ref).slice().sort((a,b)=>a.ref.replace(/<[^>]+>/g,"").localeCompare(b.ref.replace(/<[^>]+>/g,""),"fr"));
  const seen=new Set();
  const items=list.filter(r=>{const k=r.ref+(r.url||r.ourl||"");if(seen.has(k))return false;seen.add(k);return true}).map(r=>`<p>${r.ref} ${r.url||r.ourl||""}</p>`).join("");
  const models=[...new Set(Object.entries(MODELS).filter(([k])=>R.some(r=>r.fiche===k)).map(([,v])=>v))].sort((a,b)=>a.replace(/<[^>]+>/g,"").localeCompare(b.replace(/<[^>]+>/g,""),"fr")).map(m=>`<p>${m}</p>`).join("");
  return crumb("Références")+`<section class="hero"><div class="txt"><span class="eyebrow">Page complémentaire</span><h1>Références</h1></div></section><div class="panel" style="display:flex;flex-direction:column;gap:16px"><h2 style="font-size:20px">Documents et ressources en ligne</h2><div class="refs">${items}</div></div>${models?`<div class="panel" style="display:flex;flex-direction:column;gap:16px"><h2 style="font-size:20px">Modèles pédagogiques cités dans les fiches</h2><div class="refs">${models}</div></div>`:""}`+footer();
}
function renderSearch(q){
  const n=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const nq=n(q);
  const list=R.filter(r=>n(r.t+" "+r.d+" "+r.u+" "+r.sub).includes(nq)&&match(r));
  return crumb("Recherche")+`<div class="sec-head"><h1 style="font-size:30px">Résultats pour « ${esc(q)} »</h1><span>${list.length} résultat${list.length>1?"s":""}</span></div>`+(list.length?grid(list):`<div class="empty">Aucune ressource ne correspond. Essayez un autre mot, par exemple « lecture », « écriture » ou « PEI ».</div>`)+footer();
}


// ---------- Navigation ----------
const NAV=[["accueil","Accueil"],...ORDER.map(k=>[k,SECTIONS[k].label])];
const NAV2=[["index","Index A-Z"],["references","Références (APA)"]];
function drawNav(cur){
  const SH={accueil:"Accueil",documents:"Documents ministériels",ressources:"Ressources pédagogiques",developpement:"Développement professionnel",urgence:"Activités d’urgence",index:"Index A-Z",references:"Références"};
  document.getElementById("nav").innerHTML=NAV.map(([k,l])=>`<a href="#${k}" title="${l}"${k===cur?' aria-current="page"':""}>${SH[k]||l}</a>`).join("");
  document.getElementById("nav2").innerHTML=NAV2.map(([k,l])=>`<a href="#${k}" title="${l}"${k===cur?' aria-current="page"':""}>${SH[k]||l}</a>`).join("");
  document.getElementById("cycles").innerHTML=[["all","Tous"],...Object.entries(CYC)].map(([k,l])=>`<button type="button" class="chip" data-cycle="${k}" aria-pressed="${k===cycle}">${l}</button>`).join("");
}
let query="";
function route(scroll=true){
  const h=(location.hash||"#accueil").slice(1);
  const key=SECTIONS[h]||["accueil","index","references"].includes(h)?h:"accueil";
  drawNav(query?"":key);
  view.innerHTML=query?renderSearch(query):key==="accueil"?renderHome():key==="index"?renderIndex():key==="references"?renderRefs():renderSection(key);
  if(scroll)window.scrollTo({top:0});
  if(typeof reveal==="function")reveal();
}
window.addEventListener("hashchange",()=>{query="";document.getElementById("q").value="";route()});
document.getElementById("searchForm").addEventListener("submit",e=>{e.preventDefault()});
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim();route(false)});
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-cycle]");
  if(c){cycle=c.dataset.cycle;try{localStorage.setItem("cycle",cycle)}catch(err){}route(false);return}
  const g=e.target.closest("[data-goto]");
  if(g){const el=document.getElementById(g.dataset.goto);if(el)el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return}
  const f=e.target.closest("[data-fiche]");
  if(f){openFiche(f.dataset.fiche);return}
  const o=e.target.closest("[data-open]");
  if(o){const r=R.find(x=>x.id===o.dataset.open);if(r&&r.fiche){e.preventDefault();openFiche(r.fiche)}else if(r&&r.url){e.preventDefault();window.location.hash=r.sec[0]}}
  if(e.target.closest("[data-close]")){closeFiche()}
});
const dlg=document.getElementById("fiche");
function openFiche(id){
  const f=F[id];if(!f)return;
  const meta=[f.cyc,f.dur,f.volet].filter(Boolean).map(x=>`<span class="tag">${x}</span>`).join("");
  document.getElementById("ficheBody").innerHTML=`<div class="top"><div style="display:flex;flex-direction:column;gap:10px"><span class="eyebrow">Fiche maison</span><h2 id="ficheTitle">${f.t}</h2>${meta?`<div class="tags">${meta}</div>`:""}</div><button class="x" type="button" data-close aria-label="Fermer la fiche"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F1F7F4" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>`+(FDOM[id]?`<div class="use"><strong>Lien avec le programme-cadre :</strong><ul style="margin-top:6px">${FDOM[id].map(d=>`<li>${DOM[d]}</li>`).join("")}</ul></div>`:"")+f.parts.map(([h,items])=>`<div><h4>${h}</h4><ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`).join("")+(MODELS[id]?`<p class="flag"><strong>Source du modèle :</strong> ${MODELS[id]}</p>`:"")+`<div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-close>Fermer</button></div>`;
  try{dlg.showModal()}catch(e){dlg.setAttribute("open","")}
}
function closeFiche(){try{dlg.close()}catch(e){dlg.removeAttribute("open")}}
dlg.addEventListener("click",e=>{if(e.target===dlg)closeFiche()});
route(false);

// Thème sombre / clair, choisi par la personne qui visite (mémorisé dans son navigateur)
function setTheme(t){document.documentElement.setAttribute("data-theme",t);document.querySelectorAll("[data-theme-set]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.themeSet===t)));try{localStorage.setItem("theme",t)}catch(e){}}
(function(){let t="dark";try{t=localStorage.getItem("theme")||"dark"}catch(e){}setTheme(t)})();
document.addEventListener("click",e=>{const b=e.target.closest("[data-theme-set]");if(b)setTheme(b.dataset.themeSet);
  const bg=e.target.closest("#burger");const nav=document.getElementById("tnav");
  if(bg){const o=nav.classList.toggle("open");bg.setAttribute("aria-expanded",String(o));return}
  if(e.target.closest("#tnav a")){nav.classList.remove("open");document.getElementById("burger").setAttribute("aria-expanded","false")}
  if(e.target.closest("#totop")){window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
});
// En-tête qui prend une ombre au défilement + bouton « retour en haut »
addEventListener("scroll",()=>{const y=scrollY>40;document.getElementById("top").classList.toggle("scrolled",y);document.getElementById("totop").classList.toggle("on",scrollY>500)},{passive:true});
// Apparition douce des blocs au défilement
var RV=("IntersectionObserver" in window)&&!matchMedia("(prefers-reduced-motion: reduce)").matches?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");RV.unobserve(x.target)}}),{rootMargin:"0px 0px -40px 0px"}):null;
function reveal(){if(!RV)return;document.querySelectorAll("#view .card,#view .tile,#view .panel,#view .note,#view .step").forEach(el=>{if(!el.classList.contains("reveal")){el.classList.add("reveal");RV.observe(el)}})}
</script>
